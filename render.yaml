# Render Blueprint: free web service running the AMD chatbot container.
# Dashboard -> New -> Blueprint -> pick this repository. Render reads this file,
# asks for CHAT_API_KEY, builds deploy/chatbot/Dockerfile and deploys it.
services:
  - type: web
    name: llmkgraph-amd-chat
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/chatbot/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: CHAT_PROVIDER
        value: openai-compatible
      - key: CHAT_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: CHAT_API_KEY
        sync: false   # entered once in the Render dashboard, never stored in git

  - type: web
    name: llmkgraph-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: READ_ONLY
        value: "1"
      - key: EMBEDDED_STORE
        value: "1"
      - key: CORS_ORIGINS
        value: https://alexlecu.github.io
