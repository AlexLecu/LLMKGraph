# Lightweight CI: make sure the backend still imports and the frontend builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Byte-compile and import the Flask app
        env:
          OPENAI_API_KEY: dummy
          MISTRAL_API_KEY: dummy
          DEEPSEEK_API_KEY: dummy
        run: |
          python -m compileall -q . 
          python -c "import app; print('flask app imports OK')"
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt --strict || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
