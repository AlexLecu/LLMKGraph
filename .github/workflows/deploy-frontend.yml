# Builds the Vue frontend and publishes it to GitHub Pages (free).
#
# One-time setup in the GitHub repo:
#   Settings -> Pages -> Source: "GitHub Actions"
#   Settings -> Secrets and variables -> Actions -> Variables (optional):
#     VITE_API_URL      e.g. https://<your-backend>.onrender.com
#     VITE_GRAPHDB_URL  e.g. https://<your-graphdb-host>
#     VITE_CHAT_URL     e.g. https://<user>-<space>.hf.space/
#     VITE_EVAL_URL     e.g. https://<your-streamlit-host>/?embed=true
# Without those variables the page builds, but points at localhost.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GRAPHDB_URL: ${{ vars.VITE_GRAPHDB_URL }}
          VITE_CHAT_URL: ${{ vars.VITE_CHAT_URL }}
          VITE_EVAL_URL: ${{ vars.VITE_EVAL_URL }}
      # SPA fallback so deep links (/chat, /evaluation) work on Pages
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
