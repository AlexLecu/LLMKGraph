<text x="866.0" y="640" text-anchor="middle" font-size="13.5" fill="#1F2937">relation &amp; entity types,</text>
<text x="866.0" y="659" text-anchor="middle" font-size="13.5" fill="#1F2937">triple agreement (/api/evaluation)</text>
<rect x="1050" y="550" width="292" height="150" rx="12" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="1196.0" y="578" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">📏 Evaluation</text>
