<text x="438.0" y="371" text-anchor="middle" font-size="13.5" fill="#1F2937">&amp; keywords</text>
<text x="438.0" y="390" text-anchor="middle" font-size="13.5" fill="#1F2937">AMD acronym expansion</text>
<rect x="588" y="300" width="228" height="130" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
