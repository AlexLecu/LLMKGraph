<text x="830.0" y="151" text-anchor="middle" font-size="13.5" fill="#1F2937">Name normalisation</text>
<text x="830.0" y="170" text-anchor="middle" font-size="13.5" fill="#1F2937">HermiT reasoner (owlready2)</text>
