<text x="1196.0" y="621" text-anchor="middle" font-size="13.5" fill="#1F2937">MCQ · true/false · open-ended)</text>
<text x="1196.0" y="640" text-anchor="middle" font-size="13.5" fill="#1F2937">LLMs 1B–70B + GPT-5-mini, with</text>
<text x="1196.0" y="659" text-anchor="middle" font-size="13.5" fill="#1F2937">vs. without KG · RAGAS · Giskard</text>
