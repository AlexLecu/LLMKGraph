<text x="536.0" y="602" text-anchor="middle" font-size="13.5" fill="#1F2937">/api/search · /api/addRelations</text>
<text x="536.0" y="621" text-anchor="middle" font-size="13.5" fill="#1F2937">/api/reason · /api/upload_abstract</text>
<text x="536.0" y="640" text-anchor="middle" font-size="13.5" fill="#1F2937">SPARQL over GraphDB</text>
<text x="536.0" y="659" text-anchor="middle" font-size="13.5" fill="#1F2937">Gunicorn in Docker</text>
