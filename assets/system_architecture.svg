<text x="1230.0" y="371" text-anchor="middle" font-size="13.5" fill="#1F2937">Model choice · starters</text>
<text x="1230.0" y="390" text-anchor="middle" font-size="13.5" fill="#1F2937">Prompt-injection filter</text>
