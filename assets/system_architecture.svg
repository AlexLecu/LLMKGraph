<text x="966.0" y="371" text-anchor="middle" font-size="13.5" fill="#1F2937">Ollama local models or any</text>
<text x="966.0" y="390" text-anchor="middle" font-size="13.5" fill="#1F2937">OpenAI-compatible API</text>
