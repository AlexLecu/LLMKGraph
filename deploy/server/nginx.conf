# Inside the llmkgraph-web container: static UI + the three backends under one origin.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;

    location /api/ {
        proxy_pass http://api:5555;
    }

    # Chainlit runs with --root-path /chatbot and Streamlit with baseUrlPath=streamlit,
    # so the prefix is passed through unchanged. (Not /chat or /eval*: those are UI routes.)
    location /chatbot {
        proxy_pass http://chatbot:7860;
    }

    location /streamlit {
        proxy_pass http://evaluation:8502;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue router (history mode): unknown paths fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
