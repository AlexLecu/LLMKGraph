# Host nginx site for LLMKGraph: /etc/nginx/sites-available/llmkgraph
# TLS is terminated by the university reverse proxy, which forwards plain HTTP here.
# Listens on the same ports as the existing alloygraph site.
server {
    listen 80;
    listen 3000;
    server_name llmkgraph.utcluj.ro;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
