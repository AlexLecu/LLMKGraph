# Weaviate for the AMD chatbot. Data lives in the named volume `amd_weaviate_data`
# so it survives `docker compose down` (never add -v unless you mean it).
# Ports are overridable to coexist with another Weaviate on the same machine:
#   WEAVIATE_HTTP_PORT=8081 WEAVIATE_GRPC_PORT=50052 docker compose -f docker-compose-weaviate.yml up -d
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.2
    container_name: amd-weaviate
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      # The chatbot retrieves with BM25 only, so no vectorizer module is required.
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - amd_weaviate_data:/var/lib/weaviate

volumes:
  amd_weaviate_data:
